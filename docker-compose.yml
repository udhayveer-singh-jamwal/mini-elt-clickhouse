version: '3.8'

services:
  # =====================================================================
  # 1. ClickHouse OLAP Database Server
  # =====================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: mini_elt_clickhouse
    ports:
      - "8123:8123"   # HTTP REST Interface
      - "9000:9000"   # Native Client Interface
    volumes:
      - ./clickhouse/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mini_elt_net

  # =====================================================================
  # 2. Apache NiFi (Real-Time Ingestion)
  # =====================================================================
  nifi:
    image: apache/nifi:1.28.1
    container_name: mini_elt_nifi
    ports:
      - "8080:8080"   # NiFi UI and REST API
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_PROXY_HOST=localhost:8080
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
    volumes:
      - ./nifi:/opt/nifi_scripts
    depends_on:
      - clickhouse
    networks:
      - mini_elt_net

  # =====================================================================
  # 3. PostgreSQL (Airflow Metadata Database)
  # =====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mini_elt_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mini_elt_net

  # =====================================================================
  # 4. Airflow Init (DB migration & admin user setup)
  # =====================================================================
  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    container_name: mini_elt_airflow_init
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Initializing Airflow database..."
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow initial setup complete."
    networks:
      - mini_elt_net

  # =====================================================================
  # 5. Airflow Webserver
  # =====================================================================
  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: mini_elt_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-connect dbt-core dbt-clickhouse requests"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      DBT_PROFILES_DIR: /opt/airflow/dbt
    ports:
      - "8085:8080"   # Mapped to 8085 to avoid collision with NiFi 8080
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./airflow/logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mini_elt_net

  # =====================================================================
  # 6. Airflow Scheduler
  # =====================================================================
  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: mini_elt_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _PIP_ADDITIONAL_REQUIREMENTS: "clickhouse-connect dbt-core dbt-clickhouse requests"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      DBT_PROFILES_DIR: /opt/airflow/dbt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./airflow/logs:/opt/airflow/logs
    command: scheduler
    networks:
      - mini_elt_net

volumes:
  clickhouse_data:
  postgres_data:

networks:
  mini_elt_net:
    driver: bridge
